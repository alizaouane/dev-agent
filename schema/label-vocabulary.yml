states:
  - state:proposed
  - state:scoping
  - state:spec-ready
  - state:implementing
  - state:pr-review
  - state:staging-deployed
  - state:ready-to-promote
  - state:promoting
  - state:done
  - state:blocked
  - state:abandoned
  - state:rolled-back

kinds:
  - kind:user-intent
  - kind:scout-proposal
  - kind:scout-digest
  - kind:hotfix

priorities:
  - priority:p0
  - priority:p1
  - priority:p2
  - priority:p3

# Gate labels. Not part of the state machine — each one records a deliberate
# human decision to let a run past a check that refused it. They are named
# `<gate>:override` so a reviewer scanning an issue can see at a glance which
# gate was bypassed and go read why.
gates:
  - spec-approval:override
