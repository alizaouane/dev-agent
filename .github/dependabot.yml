# Dependabot — Operating Standard v5.1 §15.2, §21.
# Kit-owned file: installed/refreshed by `standard-init --upgrade`.
# github-actions is included deliberately: it keeps SHA-pinned actions current
# (a pinned action that never updates is a stale action).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
