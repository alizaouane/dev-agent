name: dev-agent · phase-staging-deploy

# Phase 2c: after a dev-agent PR merges, run the consumer's
# `deploy_skills.staging` chain and the smoke command. The agent invokes
# each skill in declared order, captures stdout/stderr, and stops on the
# first failure. The workflow flips the issue label from
# state:pr-review → state:staging-deployed when the deploy succeeds, or
# state:blocked otherwise.

on:
  workflow_call:
    inputs:
      budget_override:
        description: 'Proceed past the monthly budget cap (recorded in the run output). Use only for recovery work such as rollback.'
        required: false
        type: boolean
        default: false
      issue_number:
        required: true
        type: number
      config_path:
        required: false
        type: string
        default: '.dev-agent.yml'
      invocation_mode:
        required: false
        type: string
        default: 'live'
    secrets:
      ANTHROPIC_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      budget_override:
        description: 'Proceed past the monthly budget cap (recorded in the run output). Use only for recovery work such as rollback.'
        required: false
        type: boolean
        default: false
      issue_number:
        description: 'Issue number'
        required: true
        type: number
      config_path:
        description: 'Path to .dev-agent.yml'
        required: false
        type: string
        default: 'examples/test-repo/.dev-agent.yml'
      invocation_mode:
        description: 'live (real claude-code-action) or stub (no agent — for tests)'
        required: false
        type: string
        default: 'live'

jobs:
  staging-deploy:
    runs-on: ubuntu-latest
    # Declared here, not only in the consumer wrapper. Repos wired up before
    # the wrapper carried a concurrency group still call this workflow at
    # @main, so the guarantee has to travel with the workflow rather than
    # depend on which generation of wrapper a repo happens to have.
    concurrency:
      group: dev-agent-staging-deploy-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    # See phase-implement.yml for rationale on the long ceiling.
    timeout-minutes: 360
    # `contents: read`, because nothing in this job writes to the repo. It
    # deploys and smokes; the session log is committed by a separate job
    # below, from a workspace this agent never touched. Telling the agent not
    # to push is an instruction; withholding the permission is a boundary.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      overtaken: ${{ steps.slot.outputs.overtaken }}
      phase_outcome: ${{ steps.parse.outputs.phase_outcome }}
      next_hint: ${{ steps.parse.outputs.next_hint }}
    steps:
      # Pillar 5 — Harden runner against unexpected egress + sudo. See
      # phase-bug-scout.yml for the v1 audit-mode rationale.
      # The pre-queue check answers before this job waits for the slot, so it
      # is as old as the wait. Re-asked here, once the slot is actually held:
      # by then the run ahead has deployed and moved the label, which is the
      # case worth catching — a second deploy of the same merge.
      #
      # Every step below is conditioned on this rather than the run being
      # cancelled: `gh run cancel` needs `actions: write`, and a reusable
      # workflow cannot grant itself more than its caller does.
      - name: Check whether this dispatch was overtaken while queued
        id: slot
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISSUE=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json state,labels)
          STATE=$(jq -r '.state' <<<"$ISSUE")
          STATES=$(jq -r '[.labels[].name | select(startswith("state:"))] | join(" ")' <<<"$ISSUE")
          OVERTAKEN=false
          [ "$STATE" = "CLOSED" ] && OVERTAKEN=true
          # The state it starts from, named directly. Listing the later ones
          # would read every state added afterwards as fine to deploy.
          if [ "$(printf '%s' "$STATES" | wc -w | tr -d ' ')" != "1" ]; then
            OVERTAKEN=true
          else
            case "$STATES" in
              state:pr-review) ;;
              *) OVERTAKEN=true ;;
            esac
          fi
          if [ "$OVERTAKEN" = "true" ]; then
            echo "issue #$ISSUE_NUMBER moved on while this run waited ($STATE, $STATES); discarding this dispatch"
          fi
          echo "overtaken=$OVERTAKEN" >> "$GITHUB_OUTPUT"

      - name: Harden runner (egress audit)
        if: steps.slot.outputs.overtaken != 'true'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true
      # Consumer repo at root.
      # persist-credentials: false. The job token is read-only now, but a
      # checkout left at its default still writes whatever token it has into
      # git config, where an agent with Bash can find it. The session log is
      # committed by a separate job with its own fresh checkout.
      - uses: actions/checkout@v4
        if: steps.slot.outputs.overtaken != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Engine repo with the dev-agent CLIs + prompt templates this
      # workflow invokes. See phase-implement.yml for rationale.
      - name: Checkout dev-agent engine
        if: steps.slot.outputs.overtaken != 'true'
        uses: actions/checkout@v4
        with:
          repository: alizaouane/dev-agent
          ref: main
          path: .dev-agent-engine
          # Nothing pushes to the engine checkout; it only needs the files.
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.slot.outputs.overtaken != 'true'
        with: { node-version: '20', cache: 'npm' }

      - run: npm ci
        if: steps.slot.outputs.overtaken != 'true'

      - name: Install engine deps
        if: steps.slot.outputs.overtaken != 'true'
        working-directory: .dev-agent-engine
        run: npm ci

      # §22.1 — pre-flight budget gate. The nightly watchdog reports spend
      # AFTER it happens, which is monitoring; this refuses to start the phase
      # when the month's budget is gone or this phase would cross it. Placed
      # before any model call so a refusal costs nothing. Fails closed: if
      # spend cannot be read while a budget is configured, the run stops.
      - name: Budget gate
        if: steps.slot.outputs.overtaken != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIG_PATH: ${{ inputs.config_path }}
          PHASE: staging_deploy
          BUDGET_OVERRIDE: ${{ inputs.budget_override || 'false' }}
        run: .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/budget-gate.ts

      - name: Convert .dev-agent.yml to JSON for jq
        if: steps.slot.outputs.overtaken != 'true'
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/config-to-json.ts "$CONFIG_PATH" > /tmp/config.json
          jq -e . /tmp/config.json > /dev/null

      - name: Render system prompt
        if: steps.slot.outputs.overtaken != 'true'
        id: prompt
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MERGE_SHA: ${{ github.sha }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          # The consumer root is the directory containing .dev-agent.yml.
          # The agent will cd there before running any skill so scripts/
          # and .claude/skills/ resolve correctly.
          CONSUMER_ROOT=$(dirname "$CONFIG_PATH")
          [ "$CONSUMER_ROOT" = "." ] && CONSUMER_ROOT=""
          export PROMPT_VARS_JSON=$(jq -nc \
            --arg consumer_root "$CONSUMER_ROOT" \
            --argjson skills "$(jq -c '.deploy_skills.staging // []' /tmp/config.json)" \
            --arg staging "$(jq -r '.branches.staging // ""' /tmp/config.json)" \
            --arg test "$(jq -r '.commands.test // "npm test"' /tmp/config.json)" \
            --arg sha "$MERGE_SHA" \
            '{consumer_root:(if ($consumer_root|length) > 0 then $consumer_root else "." end), deploy_skills:{staging:$skills}, branches:{staging:(if ($staging|length) > 0 then $staging else null end)}, commands:{test:$test}, merge_sha:$sha}')
          if [ -z "$PROMPT_VARS_JSON" ]; then
            echo "::error::PROMPT_VARS_JSON is empty — jq filter produced no output" >&2
            exit 1
          fi
          .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/render-prompt.ts staging-deploy > /tmp/system-prompt.md

      - name: Read issue title
        if: steps.slot.outputs.overtaken != 'true'
        id: issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Build agent prompt
        if: steps.slot.outputs.overtaken != 'true'
        id: build
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "# Staging deploy task — issue #$ISSUE_NUMBER"
            echo ""
            echo "**Issue title:** $ISSUE_TITLE"
            echo "**Merge SHA:** \`$MERGE_SHA\`"
            echo ""
            echo "---"
            echo ""
            echo "## System / discipline (read carefully)"
            echo ""
            cat /tmp/system-prompt.md
          } > /tmp/agent-prompt.md
          echo "prompt_path=/tmp/agent-prompt.md" >> "$GITHUB_OUTPUT"

      - name: Skip live agent invocation (stub mode)
        if: steps.slot.outputs.overtaken != 'true' && (inputs.invocation_mode == 'stub')
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(printf '🤖 Phase: staging-deploy\nModel: (none)\nMode: stub\nStatus: stub-mode (no agent invocation; set invocation_mode=live to run deploy)\n')
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"

      # See phase-implement.yml — claude-code-action needs the binary
      # pre-installed at ~/.local/bin/claude.
      - name: Install Claude Code CLI
        if: steps.slot.outputs.overtaken != 'true' && (inputs.invocation_mode == 'live')
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Claude Code (live agent)
        id: claude
        if: steps.slot.outputs.overtaken != 'true' && (inputs.invocation_mode == 'live')
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.build.outputs.prompt_path }}
          claude_args: '--max-turns 500 --model claude-sonnet-4-6 --allowedTools Bash Read Glob Grep TodoWrite WebFetch'
          show_full_output: 'true'

      # Record what this run actually cost. Before this existed the only
      # telemetry any workflow posted was a stub with `Cost: $0`, so
      # month-to-date spend always read zero and both the nightly watchdog and
      # the budget gate were decorative. always() so a failed or timed-out run
      # still records the spend it incurred.
      - name: Emit telemetry
        if: steps.slot.outputs.overtaken != 'true' && (always() && inputs.invocation_mode == 'live')
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PHASE: staging_deploy
          MODEL: claude-sonnet-4-6
          AGENT_STATUS: ${{ steps.claude.outcome == 'success' && 'success' || 'blocked' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/emit-telemetry.ts

      - name: Parse agent JSON + comment telemetry + flip state
        id: parse
        if: steps.slot.outputs.overtaken != 'true' && (inputs.invocation_mode == 'live')
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # claude-execution-output.json is a JSON array of message events
          # (see anthropics/claude-code-action base-action/src/run-claude-sdk.ts).
          # The result event is the last entry: {type: "result", result: "..."}.
          # The result string contains the agent's final markdown including
          # the ```json ... ``` fenced block from prompts/staging-deploy.md.
          # awk between the fences handles nested braces in deploy_artifacts;
          # a regex like \{[^{}]*\} would silently reject the nested array.
          # Use jq's `last` rather than `tail -1` — the result string is
          # multiline (includes the agent's prose plus the fenced JSON),
          # so `tail -1` would collapse to a trailing blank.
          RESULT_TEXT=$(jq -r '[.[] | select(.type=="result") | .result // empty] | last // ""' "$EXEC_FILE" 2>/dev/null || echo "")
          AGENT_JSON=$(printf '%s' "$RESULT_TEXT" | awk '/```json/{flag=1;next} /```/{flag=0} flag' | tr -d '\n')
          [ -z "$AGENT_JSON" ] && AGENT_JSON='{}'
          SMOKE_PASSING=$(printf '%s' "$AGENT_JSON" | jq -r '.smoke_passing // false' 2>/dev/null || echo "false")
          DEPLOYS=$(printf '%s' "$AGENT_JSON" | jq -r '.deploys_completed // 0' 2>/dev/null || echo "0")
          SUMMARY=$(printf '%s' "$AGENT_JSON" | jq -r '.summary // "(no summary)"' 2>/dev/null || echo "(parse failed)")
          if [ "$SMOKE_PASSING" = "true" ]; then
            STATUS="success"
            NEW_LABEL="state:staging-deployed"
            OUTCOME="success"
            HINT="manual smoke on staging, then promote to prod when ready."
          else
            STATUS="failed (smoke or deploy did not pass)"
            NEW_LABEL="state:blocked"
            OUTCOME="blocked"
            HINT="inspect deploy/smoke logs, fix the regression, re-run staging-deploy."
          fi
          BODY=$(printf '🤖 Phase: staging-deploy\nModel: claude-sonnet-4-6\nMode: live\nStatus: %s\nDeploys completed: %s\nSmoke passing: %s\nSummary: %s\nMerge SHA: %s\n' "$STATUS" "$DEPLOYS" "$SMOKE_PASSING" "$SUMMARY" "${GITHUB_SHA}")
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          gh issue edit "$ISSUE_NUMBER" --remove-label state:pr-review --add-label "$NEW_LABEL" || true
          echo "phase_outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
          echo "next_hint=${HINT}" >> "$GITHUB_OUTPUT"

  # A separate job, with its own checkout, because the agent above shares a
  # workspace with whatever commits from it. Dropping persisted credentials
  # narrowed that window without closing it: the agent could still edit
  # SESSION_LOG.md, stage other files, or rewrite append-session-log.ts and
  # have a later step in the same job push the result. Here the workspace is
  # fresh and the agent has never seen it, so `contents: write` is safe to
  # grant — and it is granted nowhere else in this workflow.
  session-log:
    needs: staging-deploy
    if: always() && inputs.invocation_mode == 'live' && needs.staging-deploy.outputs.overtaken != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned to an immutable revision, not `main`. This job is the only one
      # in this workflow holding `contents: write`, and it executes engine code
      # — so a mutable ref means the code running beside that credential can
      # change between review and run (CWE-829).
      #
      # MAINTENANCE: bump this in the same pull request that changes anything
      # under lib/cli/ that this job runs. A stale pin runs old CLI code; an
      # unpinned ref runs unreviewed code with a write token, which is worse.
      - name: Checkout dev-agent engine
        uses: actions/checkout@v4
        with:
          repository: alizaouane/dev-agent
          ref: 5d5d31413e12f4f4c5c810662508adcab8fd1470
          path: .dev-agent-engine
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install engine deps
        working-directory: .dev-agent-engine
        run: npm ci --omit=dev --ignore-scripts

      # No GH_TOKEN here, deliberately. This step runs engine code; the step
      # below holds the credential and runs none. The pin bounds what code can
      # run; this bounds what that code can reach if the pin is ever wrong.
      - name: Append SESSION_LOG.md entry
        env:
          PHASE: staging-deploy
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OUTCOME: ${{ needs.staging-deploy.outputs.phase_outcome || 'aborted' }}
          NEXT_SESSION_HINT: ${{ needs.staging-deploy.outputs.next_hint || 'inspect the staging-deploy run logs.' }}
          TRIGGER: 'PR merged to default branch — staging deploy + smoke verify run.'
        run: |
          set -euo pipefail
          .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/append-session-log.ts

      - name: Commit and push the session log
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- SESSION_LOG.md; then
            echo "SESSION_LOG.md unchanged — no commit needed."
            exit 0
          fi
          git config user.name 'dev-agent[bot]'
          git config user.email 'dev-agent@users.noreply.github.com'
          # Only the log. `git add -A` here would sweep anything else the
          # checkout produced into a commit nobody reviewed.
          git add SESSION_LOG.md
          git commit -m "chore(dev-agent): session log — staging-deploy issue #${ISSUE_NUMBER}"

          # Two runs for different issues append to the same file, so whichever
          # pushes second gets a non-fast-forward. The previous `|| echo`
          # swallowed exactly that and the job went green having dropped the
          # entry. Rebase and retry instead; only a push still failing after
          # three attempts is reported, and loudly.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$REMOTE" HEAD; then
              echo "session log pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing onto the current tip"
            git pull --rebase "$REMOTE" HEAD || break
            sleep $((attempt * 3))
          done
          echo "::warning::could not push the session log after 3 attempts — the entry is committed locally only. A protected branch does this; so does a rebase that could not replay."
          exit 0
