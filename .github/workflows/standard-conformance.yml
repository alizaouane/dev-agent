# standard-conformance — Operating Standard v5 §26.3 enforcement.
# Kit-owned file: installed/refreshed by `standard-init --upgrade`. Change it in
# the kit (~/.qualiency-dev-standard/ci/standard-conformance.yml), not per-repo.
# Runs .standard/check.sh (legacy repos: .bmad/check.sh until migrated).
#
# Add BOTH jobs to branch-protection required checks:
#   conformance, secrets
name: standard-conformance

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Operating Standard conformance check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash "$([ -f .standard/check.sh ] && echo .standard/check.sh || echo .bmad/check.sh)"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2 (v2.3.9)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # enforce-only; PR perms are read-only

  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # installed from PyPI rather than a third-party action: fewer supply-chain
      # surfaces, and the version is pinned here (§15.2)
      - name: Install semgrep
        run: pip install --quiet semgrep==1.97.0
      - name: Scan
        run: |
          STAMP=.standard.yml; [ -f "$STAMP" ] || STAMP=.bmad.yml
          # strip the documented inline comment, or 'enforce' never matches
          MODE=$(sed -n 's/^sast:[[:space:]]*//p' "$STAMP" 2>/dev/null | head -1 | sed 's/[[:space:]]*#.*$//' | tr -d "\"'" | xargs)
          case "$MODE" in enforce|warn) ;; *) MODE=warn ;; esac
          set +e
          semgrep scan --config p/default --severity ERROR --error --quiet --metrics off .
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then echo "✅ semgrep: no ERROR-severity findings"; exit 0; fi
          if [ "$MODE" = "enforce" ]; then
            echo "::error::semgrep found ERROR-severity issues (sast: enforce in .standard.yml)"; exit $RC
          fi
          echo "::warning::semgrep found ERROR-severity issues — advisory while .standard.yml has 'sast: warn'. Fix the baseline, then set 'sast: enforce' (§25)."
