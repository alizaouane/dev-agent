# standard-conformance — Operating Standard v5 §26.3 enforcement.
# Kit-owned file: installed/refreshed by `standard-init --upgrade`. Change it in
# the kit (~/.qualiency-dev-standard/ci/standard-conformance.yml), not per-repo.
# Runs .standard/check.sh (legacy repos: .bmad/check.sh until migrated).
#
# Add BOTH jobs to branch-protection required checks:
#   conformance, secrets
name: standard-conformance

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Operating Standard conformance check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash "$([ -f .standard/check.sh ] && echo .standard/check.sh || echo .bmad/check.sh)"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2 (v2.3.9)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # enforce-only; PR perms are read-only

  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # installed from PyPI rather than a third-party action: fewer supply-chain
      # surfaces, and the version is pinned here (§15.2)
      - name: Install semgrep
        run: pip install --quiet semgrep==1.97.0
      - name: Scan
        run: |
          STAMP=.standard.yml; [ -f "$STAMP" ] || STAMP=.bmad.yml
          # strip the documented inline comment, or 'enforce' never matches
          MODE=$(sed -n 's/^sast:[[:space:]]*//p' "$STAMP" 2>/dev/null | head -1 | sed 's/[[:space:]]*#.*$//' | tr -d "\"'" | xargs)
          case "$MODE" in enforce|warn) ;; *) MODE=warn ;; esac
          set +e
          semgrep scan --config p/default --severity ERROR --error --quiet --metrics off .
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then echo "✅ semgrep: no ERROR-severity findings"; exit 0; fi
          if [ "$MODE" = "enforce" ]; then
            echo "::error::semgrep found ERROR-severity issues (sast: enforce in .standard.yml)"; exit $RC
          fi
          echo "::warning::semgrep found ERROR-severity issues — advisory while .standard.yml has 'sast: warn'. Fix the baseline, then set 'sast: enforce' (§25)."

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      # A vulnerability RATCHET, not a threshold. §21 says block on
      # high/critical CVEs, but a fleet with an existing backlog cannot adopt a
      # flat gate — it would red-build everything on day one and get switched
      # off within a week (§25.1). So: the count may never RISE. A PR that
      # introduces a new high or critical fails; the existing backlog does not
      # block; and every fix lowers the ceiling permanently.
      - name: High/critical vulnerability ratchet
        run: |
          # Audit every manifest, not just the root. A monorepo whose packages
          # live under apps/* has no root package.json, and auditing only the
          # root would pass silently forever while the vulnerabilities sit in
          # the workspaces — a green gate that checked nothing.
          MANIFESTS=$(git ls-files '*package.json' 'package.json' \
                       | grep -v node_modules | xargs -n1 dirname 2>/dev/null | sort -u)
          [ -f pnpm-lock.yaml ] && MANIFESTS="."
          if [ -z "$MANIFESTS" ]; then
            echo "::warning::No package manifest found anywhere in this repo — the dependency audit checked nothing."
            exit 0
          fi

          TOTAL=0; UNPARSED=0
          for dir in $MANIFESTS; do
            ( cd "$dir" || exit 0
              if [ -f pnpm-lock.yaml ]; then
                corepack enable >/dev/null 2>&1 || true
                pnpm audit --json > /tmp/audit.json 2>/dev/null || true
              else
                npm audit --json > /tmp/audit.json 2>/dev/null || true
              fi ) || true
            N=$(jq -r 'if .metadata.vulnerabilities then ((.metadata.vulnerabilities.high//0)+(.metadata.vulnerabilities.critical//0)) elif .advisories then ([.advisories[]|select(.severity=="high" or .severity=="critical")]|length) else -1 end' /tmp/audit.json 2>/dev/null || echo -1)
            [ -n "$N" ] || N=-1
            if [ "$N" = "-1" ]; then UNPARSED=1; else
              echo "  $dir: $N high/critical"
              TOTAL=$((TOTAL + N))
            fi
          done

          COUNT=$TOTAL
          [ "$UNPARSED" = "1" ] && COUNT=-1

          if [ "$COUNT" = "-1" ]; then
            echo "::warning::Could not parse audit output — skipping the ratchet rather than guessing."
            exit 0
          fi

          STAMP=.standard.yml; [ -f "$STAMP" ] || STAMP=.bmad.yml
          BASE=$(sed -n 's|^audit_baseline:[[:space:]]*||p' "$STAMP" 2>/dev/null                   | head -1 | sed 's/[[:space:]]*#.*$//' | tr -d '"' | xargs)

          echo "high+critical advisories: $COUNT"
          if [ -z "$BASE" ]; then
            echo "::warning::No audit_baseline in $STAMP. Set 'audit_baseline: $COUNT' to freeze the ceiling — until then this is advisory and the count can drift upward unnoticed (§21)."
            exit 0
          fi
          echo "baseline: $BASE"

          if [ "$COUNT" -gt "$BASE" ]; then
            echo "::error::High/critical advisories rose from $BASE to $COUNT. This change introduces new vulnerable dependencies; fix them or justify raising audit_baseline in $STAMP."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASE" ]; then
            echo "::notice::Advisories fell from $BASE to $COUNT — lower 'audit_baseline' to $COUNT in $STAMP so the gain is locked in."
          fi
          echo "✅ no increase in high/critical advisories"
