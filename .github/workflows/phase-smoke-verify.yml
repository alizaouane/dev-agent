name: dev-agent · phase-smoke-verify

on:
  workflow_call:
    inputs:
      config_path:
        description: 'Path to .dev-agent.yml'
        required: false
        type: string
        default: '.dev-agent.yml'
      budget_override:
        description: 'Proceed past the monthly budget cap (recorded in the run output). Use only for recovery work such as rollback.'
        required: false
        type: boolean
        default: false
      issue_number:
        required: true
        type: number
      smoke_phase:
        required: true
        type: string
      smoke_output:
        required: true
        type: string
      smoke_exit_code:
        required: true
        type: number
      invocation_mode:
        required: false
        type: string
        default: 'stub'
    secrets:
      ANTHROPIC_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to .dev-agent.yml'
        required: false
        type: string
        default: '.dev-agent.yml'
      budget_override:
        description: 'Proceed past the monthly budget cap (recorded in the run output). Use only for recovery work such as rollback.'
        required: false
        type: boolean
        default: false
      issue_number:
        description: 'Issue number'
        required: true
        type: number
      smoke_phase:
        description: 'staging or prod'
        required: true
        type: string
      smoke_output:
        description: 'captured smoke output'
        required: true
        type: string
      smoke_exit_code:
        description: 'smoke exit code'
        required: true
        type: number
      invocation_mode:
        description: 'stub or live'
        required: false
        type: string
        default: 'stub'

jobs:
  smoke-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Pillar 5 — Harden runner against unexpected egress + sudo. See
      # phase-bug-scout.yml for the v1 audit-mode rationale.
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true
      - uses: actions/checkout@v7.0.1

      # actions/checkout above clones the *consumer's* repo — which has no
      # lib/cli tooling. The reusable-workflow YAML ships from dev-agent but
      # its scripts don't, so check the engine out separately into a subdir
      # (excluded from git state so it can't dirty the consumer's tree).
      # Tracks main. Earlier attempt with github.workflow_sha was wrong: in a
      # reusable workflow, that context resolves to the CALLER's SHA (the
      # consumer's repo), not this workflow's SHA. Since every consumer
      # now tracks @main directly (v1 tag deleted), main-vs-main is consistent.
      - name: Reserve engine checkout from git state
        run: echo '.dev-agent-engine/' >> .git/info/exclude

      - name: Checkout dev-agent engine
        uses: actions/checkout@v7.0.1
        with:
          repository: alizaouane/dev-agent
          ref: main
          path: .dev-agent-engine

      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }

      # Record this Node's absolute path before anything else can change PATH.
      # The consumer's own Node is set up below; engine CLIs keep running on
      # this one through "$ENGINE_NODE", whatever `node` resolves to later.
      - name: Pin the engine's Node
        run: echo "ENGINE_NODE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install engine deps
        working-directory: .dev-agent-engine
        run: npm ci

      # The consumer's install, tests, typecheck, build and the agent's shell
      # run on the Node the consumer declares (.dev-agent.yml runtime.node,
      # .nvmrc, .node-version, .tool-versions, package.json), not the engine's.
      - name: Resolve the consumer's Node
        id: consumer-node
        env:
          REPO_ROOT: ${{ github.workspace }}
          CONFIG_PATH: ${{ inputs.config_path || '.dev-agent.yml' }}
        run: |
          "$ENGINE_NODE" .dev-agent-engine/node_modules/tsx/dist/cli.mjs .dev-agent-engine/lib/cli/resolve-consumer-node.ts

      - name: Set up the consumer's Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.consumer-node.outputs.node_version }}

      - run: npm ci

      # §22.1 — pre-flight budget gate. The nightly watchdog reports spend
      # AFTER it happens, which is monitoring; this refuses to start the phase
      # when the month's budget is gone or this phase would cross it. Placed
      # before any model call so a refusal costs nothing. Fails closed: if
      # spend cannot be read while a budget is configured, the run stops.
      - name: Budget gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIG_PATH: ${{ inputs.config_path }}
          PHASE: smoke_verify
          BUDGET_OVERRIDE: ${{ inputs.budget_override || 'false' }}
        run: |
          "$ENGINE_NODE" .dev-agent-engine/node_modules/tsx/dist/cli.mjs .dev-agent-engine/lib/cli/budget-gate.ts

      - name: Classify smoke output (stub)
        env:
          MODEL: claude-haiku-4-5
          INVOCATION_MODE: ${{ inputs.invocation_mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SMOKE_PHASE: ${{ inputs.smoke_phase }}
          SMOKE_OUTPUT: ${{ inputs.smoke_output }}
          SMOKE_EXIT_CODE: ${{ inputs.smoke_exit_code }}
        run: |
          set -euo pipefail
          export PROMPT_VARS_JSON=$(jq -nc \
            --arg phase "$SMOKE_PHASE" \
            --arg out "$SMOKE_OUTPUT" \
            --argjson code "$SMOKE_EXIT_CODE" \
            --argjson issue "$ISSUE_NUMBER" \
            '{smoke_phase:$phase, smoke_output:$out, smoke_exit_code:$code, issue_number:$issue}')
          "$ENGINE_NODE" .dev-agent-engine/node_modules/tsx/dist/cli.mjs .dev-agent-engine/lib/cli/render-and-run.ts smoke-verify
