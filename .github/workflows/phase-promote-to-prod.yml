name: dev-agent · phase-promote-to-prod

on:
  workflow_call:
    inputs:
      budget_override:
        description: 'Proceed past the monthly budget cap (recorded in the run output). Use only for recovery work such as rollback.'
        required: false
        type: boolean
        default: false
      issue_number:
        required: true
        type: number
      config_path:
        required: false
        type: string
        default: '.dev-agent.yml'
      invocation_mode:
        required: false
        type: string
        default: 'stub'
    secrets:
      ANTHROPIC_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      budget_override:
        description: 'Proceed past the monthly budget cap (recorded in the run output). Use only for recovery work such as rollback.'
        required: false
        type: boolean
        default: false
      issue_number:
        description: 'Issue number'
        required: true
        type: number
      config_path:
        description: 'Path to .dev-agent.yml'
        required: false
        type: string
        default: 'examples/test-repo/.dev-agent.yml'
      invocation_mode:
        description: 'stub or live'
        required: false
        type: string
        default: 'stub'

jobs:
  promote-to-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
    steps:
      # Pillar 5 — Harden runner against unexpected egress + sudo. See
      # phase-bug-scout.yml for the v1 audit-mode rationale.
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true
      - uses: actions/checkout@v7
      - name: Checkout dev-agent engine
        uses: actions/checkout@v7
        with:
          repository: alizaouane/dev-agent
          ref: main
          path: .dev-agent-engine
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Install engine deps
        working-directory: .dev-agent-engine
        run: npm ci

      # §22.1 — pre-flight budget gate. The nightly watchdog reports spend
      # AFTER it happens, which is monitoring; this refuses to start the phase
      # when the month's budget is gone or this phase would cross it. Placed
      # before any model call so a refusal costs nothing. Fails closed: if
      # spend cannot be read while a budget is configured, the run stops.
      - name: Budget gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIG_PATH: ${{ inputs.config_path }}
          PHASE: promote_to_prod
          BUDGET_OVERRIDE: ${{ inputs.budget_override || 'false' }}
        run: .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/budget-gate.ts

      # Unbuilt, and now it says so. `render-and-run.ts` asks the model for a
      # promotion plan and prints the answer — it deploys nothing, merges
      # nothing and runs no smoke. The step used to report a canned success
      # regardless, which told the operator production had been promoted off
      # the back of a model reply nobody read. Failing is the honest report:
      # the issue reaches state:promoting, the run goes red, and the dashboard
      # shows a phase that did not succeed rather than one that claimed to.
      - name: Run prod promote chain (NOT IMPLEMENTED — fails deliberately)
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MODEL: claude-sonnet-4-6
          INVOCATION_MODE: ${{ inputs.invocation_mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONFIG_PATH: ${{ inputs.config_path }}
          MERGE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PROMPT_VARS_JSON=$(jq -nc \
            --argjson skills "$(jq -c '.deploy_skills.prod' "$CONFIG_PATH")" \
            --arg target "$(jq -r '.branches.release_target' "$CONFIG_PATH")" \
            --arg test "$(jq -r '.commands.test' "$CONFIG_PATH")" \
            --arg sha "$MERGE_SHA" \
            '{deploy_skills:{prod:$skills}, branches:{release_target:$target}, commands:{test:$test}, merge_sha:$sha}')
          .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/render-and-run.ts promote-to-prod > result.json
          MODEL=$(jq -r '.model' result.json)
          BODY=$(printf '🤖 Phase: promote-to-prod\nModel: %s\nMode: %s\nStatus: NOT IMPLEMENTED — this phase renders a promotion plan and does not execute it. Nothing has been deployed to production. Promote by hand until it is built.\n' "$MODEL" "$INVOCATION_MODE")
          gh issue comment "$ISSUE_NUMBER" --body "$BODY" || true
          echo "::error::phase-promote-to-prod is not implemented; nothing was deployed to production"
          exit 1

      # Its own step, on failure(), rather than inline above. Inline, `set -e`
      # skipped the label edit whenever the comment call failed, and `|| true`
      # then hid the edit's own failure — leaving the issue at state:promoting,
      # which is the exact outcome this exists to prevent. Retried, because a
      # single API call is the thing that just went wrong.
      - name: Mark the promotion blocked
        if: failure()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
                 --remove-label state:promoting --add-label state:blocked; then
              echo "issue #$ISSUE_NUMBER marked blocked"
              exit 0
            fi
            echo "attempt $attempt to mark #$ISSUE_NUMBER blocked failed; retrying"
            sleep $((attempt * 5))
          done
          # Loud, because an issue left at state:promoting reads as in flight
          # for ever and no gate offers a retry.
          echo "::error::could not move issue #$ISSUE_NUMBER off state:promoting; it will read as in flight until someone relabels it"
          exit 1

      - name: Append SESSION_LOG.md entry
        if: always() && inputs.invocation_mode == 'live'
        env:
          PHASE: promote-to-prod
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          # Read from the job, not asserted. This step is `always()`, so a
          # hardcoded value wrote "success" into the log for the run that had
          # just failed — the same canned claim removed from the comment
          # above, surviving in the record the PM agent grounds itself on.
          OUTCOME: ${{ job.status }}
          TRIGGER: 'Staging → release_target promotion approved by user.'
          NEXT_SESSION_HINT: 'promotion to production is not implemented — promote by hand and record what you did.'
        run: |
          set -euo pipefail
          .dev-agent-engine/node_modules/.bin/tsx .dev-agent-engine/lib/cli/append-session-log.ts
          if git diff --quiet -- SESSION_LOG.md; then
            echo "SESSION_LOG.md unchanged — no commit needed."
            exit 0
          fi
          git config user.name 'dev-agent[bot]'
          git config user.email 'dev-agent@users.noreply.github.com'
          git add SESSION_LOG.md
          git commit -m "chore(dev-agent): session log — promote-to-prod issue #${ISSUE_NUMBER}"
          git push origin HEAD || echo "push failed (likely a protected branch — entry is committed locally; consumer can rebase)"
