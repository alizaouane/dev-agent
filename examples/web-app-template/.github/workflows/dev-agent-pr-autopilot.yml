name: dev-agent · pr-autopilot
run-name: ${{ github.event_name }} → pr-autopilot sweep

# Keeps dev-agent's pull requests moving without anyone watching them.
#
# Every 20 minutes it looks at the open PRs on dev-agent-owned branches and
# asks the question the operator would otherwise have to remember to ask: is
# anything red, unreviewed, or unresolved? When something is, it wakes the
# fixer by dispatching `dev-agent-pr-review.yml` for that PR, and leaves a
# short comment saying so. (It used to post `@claude`, but a comment made with
# GITHUB_TOKEN starts no run, so the fixer never woke.)
#
# It touches only `feat/dev-agent-issue-*` and `dev-agent/spec-*` branches,
# never a draft, and never a PR labelled `autopilot:off`. It makes no model
# call of its own; the fixer it wakes runs the usual pre-flight budget gate.
# After four attempts on an unchanged set of blockers it stands down and says
# so on the PR, so a stuck PR stops costing anything and is not silently
# abandoned.
#
# To pause it: disable this workflow in the Actions tab, or label the PR
# `autopilot:off`.
#
# Requires: `dev-agent-pr-review.yml` in this repo, with its
# `workflow_dispatch` trigger, on the default branch (the fixer this wakes),
# and dev-agent's dispatching pr-autopilot.yml in the pinned ref below.

on:
  schedule:
    # Disjoint on purpose. `*/20` and `0 * * * *` both fire on the hour, and
    # GitHub starts two identical sweeps. The concurrency group serialises
    # them rather than dropping one, so the second re-reads the same blocker
    # signature and counts a repeat — burning one of the four stand-down
    # attempts without an attempt having happened.
    - cron: '20,40 6-20 * * 1-5'
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Triage only this PR (blank sweeps every open PR)'
        required: false
        type: string
      dry_run:
        description: 'Report what would be posted, without posting'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  # Dispatching the fixer (`gh workflow run dev-agent-pr-review.yml`).
  actions: write
  # `statusCheckRollup` reads CheckRun and StatusContext nodes, and the token
  # cannot see either without these. Without them `gh pr list` fails outright
  # with "Resource not accessible by integration" — the sweep does not degrade
  # to seeing no checks, it errors, so every PR goes untriaged.
  checks: read
  statuses: read

jobs:
  autopilot:
    uses: alizaouane/dev-agent/.github/workflows/pr-autopilot.yml@v1
    with:
      pr_number: ${{ inputs.pr_number }}
      dry_run: ${{ inputs.dry_run || false }}
