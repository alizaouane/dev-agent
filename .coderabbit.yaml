# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration — cost controls plus the docstring merge gate.
#
# inheritance: true is load-bearing. Without it a repository .coderabbit.yaml
# REPLACES the organization/UI settings ("Without inheritance, only the
# highest-priority source is used" — docs.coderabbit.ai/configuration/
# configuration-inheritance). The chain still stops at the first parent level
# where inheritance is false or unset, so an omitted setting here does not
# automatically reach UI/org defaults unless every level up the chain also has
# inheritance: true. dev-agent has no UI settings configured (checked via
# `@coderabbitai configuration`), so request_changes_workflow and the
# docstring pre-merge check below are set explicitly here — they are the only
# source of truth for this repo, not the UI.
inheritance: true

reviews:
  # Files CodeRabbit is billed for but that carry nothing to review: generated
  # lockfiles and kit-owned copies synced by `standard-init --upgrade` (changes
  # to those are reviewed in the kit repo, not here).
  path_filters:
    - "!**/package-lock.json"
    - "!.standard/check.sh"

  # Required so an `error`-mode pre-merge check (docstrings, below) can
  # actually block merge instead of only reporting in the walkthrough.
  request_changes_workflow: true

  pre_merge_checks:
    # 100% docstring coverage on every function/method/class/exported symbol
    # touched by a PR (user decision, 2026-07-01 — see CLAUDE.md §10). `error`
    # + request_changes_workflow above turns a sub-100% PR into a blocking
    # "request changes" review instead of the 80%-threshold warning default.
    docstrings:
      mode: error
      threshold: 100
